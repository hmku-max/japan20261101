<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>金澤散步｜十一月初</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --panel:rgba(247,242,232,.9);--ink:#20242c;--muted:#5d5a52;--gold:#a87f2a;--beni:#9b2d24;
  --chip:rgba(247,242,232,.82);--line:rgba(168,127,42,.5);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --panel:rgba(24,31,47,.84);--ink:#f1ebdf;--muted:#c3b9a6;--gold:#d4ae5a;--beni:#e0665a;
  --chip:rgba(24,31,47,.74);--line:rgba(212,174,90,.5);}}
:root[data-theme="dark"]{--panel:rgba(24,31,47,.84);--ink:#f1ebdf;--muted:#c3b9a6;--gold:#d4ae5a;--beni:#e0665a;--chip:rgba(24,31,47,.74);--line:rgba(212,174,90,.5);}
html,body{height:100%;margin:0;overflow:hidden;background:#232a38;
  font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;color:var(--ink);-webkit-user-select:none;user-select:none}
canvas#view{position:fixed;top:0;left:0;width:100%;height:100%;touch-action:none;display:block}
.top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 10px);
  right:10px;max-width:420px;display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:3}
.chips{display:flex;gap:6px;flex-wrap:wrap;pointer-events:auto}
.chips button{font:inherit;font-size:14px;padding:6px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--chip);color:var(--ink);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);cursor:pointer}
.chips button[aria-current="true"]{background:var(--beni);color:#fff;border-color:transparent}
.chips button.util{border-style:dashed}
.chips button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.card{pointer-events:auto;background:var(--panel);border-left:3px solid var(--gold);padding:11px 14px 12px;
  border-radius:3px 12px 12px 3px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  transition:opacity .35s,transform .35s;cursor:pointer}
.card.hide{opacity:0;transform:translateY(-6px);pointer-events:none}
.card h2{margin:0;font-size:22px;font-weight:700;letter-spacing:.06em}
.card h2 small{font-size:12px;font-weight:400;color:var(--muted);margin-left:8px;letter-spacing:0}
.card ul{margin:7px 0 0;padding-left:1.1em;font-size:14px;line-height:1.7}
.card .note{margin-top:5px;font-size:13px;color:var(--beni)}
.card.mini ul,.card.mini .note{display:none}
#joy{position:fixed;left:calc(env(safe-area-inset-left,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
  width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.6);
  touch-action:none;display:none;z-index:3}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
  background:rgba(255,255,255,.78);box-shadow:0 2px 8px rgba(0,0,0,.25)}
@media (pointer:coarse){#joy{display:block}}
body.touring #joy,body.touring .card,body.touring .hint{display:none}
.hint{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);font-size:12px;line-height:1.6;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.7);pointer-events:none;text-align:right;z-index:3}
#sub{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 9vh);text-align:center;z-index:3;
  color:#fff8ea;font-size:clamp(20px,3.4vw,34px);font-weight:600;letter-spacing:.18em;pointer-events:none;
  text-shadow:0 2px 12px rgba(0,0,0,.65),0 0 2px rgba(0,0,0,.8);opacity:0;transition:opacity 1s;padding:0 16px}
#sub.on{opacity:1}
#fade{position:fixed;inset:0;background:#0d0d10;opacity:0;pointer-events:none;transition:opacity .7s;z-index:4}
#intro{position:fixed;top:0;left:0;width:100%;height:100%;display:grid;place-items:center;z-index:5;
  background:linear-gradient(180deg,rgba(18,24,38,.42),rgba(70,24,16,.7));transition:opacity .9s}
#intro.gone{opacity:0;pointer-events:none}
.intro-in{color:#f6efe1;text-align:center;padding:24px;max-width:30em}
.v{display:flex;flex-direction:row-reverse;justify-content:center;align-items:flex-start;gap:14px;margin-bottom:22px}
.v b{writing-mode:vertical-rl;font-size:clamp(64px,19vw,112px);font-weight:700;line-height:1;letter-spacing:.08em;
  text-shadow:0 3px 18px rgba(0,0,0,.35)}
.v span{writing-mode:vertical-rl;font-size:clamp(18px,4.6vw,24px);letter-spacing:.3em;padding-top:.6em;color:#e9cf8f}
.intro-in p{font-size:15px;line-height:1.8;margin:0 auto 6px;max-width:24em}
.intro-in .small{font-size:13px;opacity:.82}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btns button{font:inherit;font-size:17px;font-weight:600;letter-spacing:.15em;padding:12px 28px;border:0;border-radius:2px;cursor:pointer}
#go{background:#c9a24a;color:#2a1d0c;box-shadow:0 0 0 1px #e8cf8a inset}
#tour{background:transparent;color:#f6efe1;box-shadow:0 0 0 1px rgba(246,239,225,.7) inset}
.btns button:disabled{opacity:.5;cursor:wait}
.btns button:focus-visible{outline:2px solid #fff;outline-offset:3px}
#status{min-height:1.4em}
@media (prefers-reduced-motion:reduce){.card,#intro,#sub,#fade{transition:none}}
[hidden]{display:none!important}
#fab{display:none!important}
:root{--sheet:#f7f2e8;--field:rgba(255,255,255,.7);--d0:#6b6458;--d1:#9b2d24;--d2:#2f4a7a;--d3:#55703a;--d4:#a87f2a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sheet:#1d2433;--field:rgba(255,255,255,.07);--d0:#b3aa98;--d1:#e0665a;--d2:#8fa9dc;--d3:#9cc072;--d4:#d4ae5a}}
:root[data-theme="dark"]{--sheet:#1d2433;--field:rgba(255,255,255,.07);--d0:#b3aa98;--d1:#e0665a;--d2:#8fa9dc;--d3:#9cc072;--d4:#d4ae5a}
.chips button.jr{background:#20242c;color:#f6efe1;border-color:rgba(232,207,138,.55);font-weight:600}
.card .zn{margin-top:9px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card.mini .zn{display:none}
.zn img{width:38px;height:38px;object-fit:cover;border-radius:3px;display:block}
.zn button,.acts button{font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.zn button.pri,.acts button.pri{background:var(--beni);color:#fff;border-color:transparent}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acts button:disabled{opacity:.5;cursor:wait}
#fab{position:fixed;right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:3;
  font:inherit;font-size:16px;font-weight:700;letter-spacing:.14em;padding:13px 22px;border:0;border-radius:999px;background:var(--beni);color:#fff;
  box-shadow:0 4px 16px rgba(0,0,0,.35);cursor:pointer;display:none}
#fab:focus-visible{outline:2px solid #fff;outline-offset:3px}
body.started #fab{display:block}
body.touring #fab,body.sheet-open #fab,body.sheet-open #joy,body.sheet-open .card,body.sheet-open .hint{display:none!important}
.hint{bottom:calc(env(safe-area-inset-bottom,0px) + 76px)!important}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,540px);max-height:76vh;max-height:76dvh;
  display:flex;flex-direction:column;background:var(--sheet);color:var(--ink);border-radius:16px 16px 0 0;
  box-shadow:0 -8px 30px rgba(0,0,0,.35);z-index:6;padding-bottom:env(safe-area-inset-bottom,0px);-webkit-user-select:text;user-select:text}
.sheet header{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.sheet h3{margin:0;font-size:20px;letter-spacing:.08em;flex:1}
.sheet header button{font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.sb{overflow-y:auto;padding:12px 18px 20px;-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{flex:none;font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--dc);color:#fff;border-color:transparent}
.dsub{font-size:13px;color:var(--muted);margin:10px 0 4px}
.it{list-style:none;padding:10px 0 10px 12px;border-left:2px solid var(--dc);margin:0}
.it+.it{margin-top:2px}
.it .tm{font-size:12px;color:var(--muted)}
.it .tt{font-size:16px;font-weight:700;margin:1px 0 2px}
.it .ds{font-size:13.5px;line-height:1.65;color:var(--muted)}
.it .acts{margin-top:6px}
ol.itl{margin:6px 0 0;padding:0}
.dnotes{font-size:13px;color:var(--beni);line-height:1.65;padding-left:1.1em;margin:12px 0 0}
.grp{margin:14px 0 6px;font-size:14px;font-weight:700;color:var(--dc);letter-spacing:.06em}
.grp:first-child{margin-top:4px}
.en{border-left:3px solid var(--dc);padding:6px 0 10px 12px;margin-bottom:10px}
.en .eh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.en .eh b{font-size:16px}
.en time{font-size:12px;color:var(--muted);flex:none}
.en p{margin:4px 0 0;font-size:15px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px}
.ph button{padding:0;border:0;background:none;cursor:zoom-in;display:block}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:3px;display:block}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.empty{font-size:14.5px;line-height:1.8;color:var(--muted);padding:8px 0}
.fld{display:block;margin-bottom:12px;font-size:13px;color:var(--muted)}
.fld input,.fld select,.fld textarea{display:block;width:100%;box-sizing:border-box;margin-top:4px;font:inherit;font-size:16px;color:var(--ink);
  background:var(--field);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
.fld textarea{resize:vertical;min-height:96px;line-height:1.6}
.pv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 10px}
.pv div{position:relative}
.pv img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;display:block}
.pv button{position:absolute;top:2px;right:2px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:15px;line-height:26px;padding:0;cursor:pointer}
.ck{display:flex;gap:8px;align-items:center;font-size:14px;margin:6px 0 4px}
.ck input{width:18px;height:18px}
.msg{font-size:13.5px;color:var(--beni);min-height:1.4em;margin:6px 0 0}
.sheet button:focus-visible,.zn button:focus-visible,.fld :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#viewer{position:fixed;inset:0;z-index:8;background:rgba(8,8,10,.94);display:grid;place-items:center;padding:20px}
#viewer img{max-width:100%;max-height:86vh;object-fit:contain}
#viewer button{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%);z-index:9;background:#20242c;color:#f6efe1;
  padding:9px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.sheet.paper{--pi:#3E3A39;--pp:#FFFCF6;--pc:#F2A497;--py:#F6D27A;--pw:#A8D3E6;--pb:#B9DAA5;background:var(--pp);color:var(--pi);
  font-family:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;border-top:3px solid var(--pi)}
.sheet.paper header{border-bottom:3px solid var(--pi)}
.sheet.paper h3{font-weight:400;font-size:22px;letter-spacing:.04em}
.sheet.paper header button{border:2.5px solid var(--pi);color:var(--pi);background:var(--pp)}
.sheet.paper .sb{font-size:16px;line-height:1.65}
.otabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:2px 0 16px}
.otab{font:inherit;color:var(--pi);border:3px solid var(--pi);border-radius:12px;background:var(--pp);padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;line-height:1.3;
  box-shadow:0 4px 0 var(--pi);transition:transform .15s,box-shadow .15s;cursor:pointer}
.otab .d{font-size:13px;color:#6b6563}.otab .dt{font-size:18px}
.otab[aria-pressed="true"]{background:var(--py);transform:translateY(4px);box-shadow:0 0 0 var(--pi)}
.otab[aria-pressed="true"] .d{color:var(--pi)}
.sheet.paper .dayhead{border:3px solid var(--pi);border-radius:20px;padding:12px 14px;display:flex;gap:12px;align-items:center;margin-bottom:18px}
.sheet.paper .dayhead svg{width:58px;height:58px;flex:none}
.sheet.paper .dayhead .t{font-size:19px;line-height:1.35}.sheet.paper .dayhead .s{font-size:14px;color:#6b6563}
.sheet.paper .tl{list-style:none;position:relative;padding-left:26px;margin:0}
.sheet.paper .tl::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;border-left:3px solid var(--pi)}
.sheet.paper .tl li{position:relative;margin-bottom:12px}
.sheet.paper .tl li::before{content:"";position:absolute;left:-24px;top:14px;width:14px;height:14px;border-radius:50%;border:3px solid var(--pi);background:var(--pp);box-sizing:border-box}
.sheet.paper .tl li.must::before{background:var(--pc);width:18px;height:18px;left:-26px;top:12px}
.sheet.paper .item{border:3px solid var(--pi);border-radius:16px;padding:10px 13px;background:var(--pp)}
.sheet.paper .tl li.must .item{background:#FDEEEA}
.sheet.paper .item .tm{font-size:14px;font-variant-numeric:tabular-nums;color:#6b6563}
.sheet.paper .item .tt{font-size:17px;line-height:1.4;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sheet.paper .item .ds{font-size:14px;margin-top:3px}
.sheet.paper .badge{font-size:12px;border:2.5px solid var(--pi);border-radius:999px;padding:0 8px;background:var(--pc);line-height:1.5}
.sheet.paper .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.sheet.paper .tag{font-size:12.5px;display:inline-flex;align-items:center;gap:4px;border:2px solid var(--pi);border-radius:999px;padding:1px 9px 1px 6px}
.sheet.paper .tag svg{width:16px;height:16px}
.sheet.paper .tag.plane{background:var(--pw)}.sheet.paper .tag.bus{background:var(--py)}.sheet.paper .tag.loop{background:var(--pc)}.sheet.paper .tag.walk{background:var(--pb)}
.sheet.paper .notes{margin-top:8px;border:3px dashed var(--pi);border-radius:16px;padding:10px 13px;font-size:14px;list-style:none}
.sheet.paper .notes li{padding-left:1.2em;text-indent:-1.2em}.sheet.paper .notes li::before{content:"※ "}
.oacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;padding-top:8px;border-top:2px dashed #d8d2cb}
.oacts button{font:inherit;font-size:13px;color:var(--pi);border:2.5px solid var(--pi);border-radius:999px;background:var(--pp);padding:2px 12px;cursor:pointer}
.oacts button.y{background:var(--py)}
.oacts.otop{border:0;margin:0 0 14px;padding:0;align-items:center}
.ofine{font-size:12.5px;color:#6b6563}
.ofld{display:block;margin-bottom:12px;font-size:14px;color:#6b6563}
.ofld input,.ofld select,.ofld textarea{display:block;width:100%;box-sizing:border-box;margin-top:4px;font:inherit;font-size:16px;color:#3E3A39;background:#FFFCF6;border:2.5px solid #3E3A39;border-radius:12px;padding:8px 10px}
.ofld textarea{resize:vertical;line-height:1.6}
.ochk{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:6px;font-size:15px;color:#3E3A39}
.ochk label{display:inline-flex;align-items:center;gap:6px}
.ochk input{width:18px;height:18px;accent-color:#3E3A39}
.sheet.paper .msg{color:#b2443a}
.sheet.paper button:focus-visible{outline:3px dashed var(--pi);outline-offset:3px}
.chips{flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;max-width:calc(100vw - 20px)}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none}
.top{max-width:min(560px,calc(100vw - 20px))!important}

</style>
</head>
<body>
<div class="top">
  <nav class="chips" id="chips" aria-label="前往景點"></nav>
  <section class="card hide" id="card" aria-live="polite"></section>
</div>
<div id="joy" aria-hidden="true"><i></i></div>
<div class="hint" id="hint"></div>
<div id="sub" aria-live="polite"></div>
<div id="fade"></div>

<button id="fab" type="button">記一筆</button>
<section id="sheet" class="sheet" hidden role="dialog" aria-labelledby="shT">
  <header><h3 id="shT"></h3><button type="button" id="shX">關閉</button></header>
  <div class="sb" id="shB"></div>
</section>
<div id="viewer" hidden><img alt="筆記照片"><button type="button">關閉</button></div>
<div id="toast" aria-live="polite"></div>

<div id="intro">
  <div class="intro-in">
    <div class="v"><b>金澤</b><span>十一月初</span></div>
    <p>雪吊剛架上松樹，楓葉開始轉紅，螃蟹季也開始了。照著四天三夜的行程，從金澤站、近江町市場、兼六園，一路逛到長町和東茶屋街。</p>
    <p class="small" id="howto"></p>
    <p class="small">風格化示意場景，景點距離已縮短。</p>
    <div class="btns"><button id="go" disabled>自己散步</button><button id="tour" disabled>自動導覽</button></div>
    <p class="small" id="status">場景載入中…</p>
  </div>
</div>

<script type="importmap">

</script>
<script>
setTimeout(function(){var s=document.getElementById('status');if(s&&!window.KZ_READY)s.textContent='載入較久，若一直沒反應請重新整理頁面。';},20000);
</script>
<script type="module">

const pick = a => a[(R() * a.length) | 0];

function ctex(w, h, draw, {srgb = true, repeat = true} = {}) {

  t.anisotropy = ANISO; return t;
}
function speck(g, w, h, n, cols, smin = 1, smax = 3) {

}
function blot(g, w, h, n, col, rmin, rmax) {

    const x = R() * w, y = R() * h, r = rr(rmin, rmax);
    for (const ox of [-w, 0, w]) for (const oy of [-h, 0, h]) {

      gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)');

    }
  }
}

function mapleShape(g, x, y, s, rot) {
  g.save(); g.translate(x, y); g.rotate(rot); g.beginPath();
  const lobes = [1, .82, .82, .5, .5];
  const ang = [0, .95, -.95, 1.85, -1.85];
  const order = [4, 2, 0, 1, 3];
  const pts = [];
  for (let k = 0; k < 5; k++) {
    const idx = order[k], a = ang[idx] - Math.PI / 2, L = lobes[idx] * s;
    const a0 = a - .28, a1 = a + .28;
    pts.push([Math.cos(a0) * s * .32, Math.sin(a0) * s * .32]);
    pts.push([Math.cos(a) * L, Math.sin(a) * L]);
    pts.push([Math.cos(a1) * s * .32, Math.sin(a1) * s * .32]);
  }
  pts.sort((p, q) => Math.atan2(p[1], p[0]) - Math.atan2(q[1], q[0]));
  g.moveTo(pts[0][0], pts[0][1]); for (const p of pts) g.lineTo(p[0], p[1]); g.closePath(); g.fill();
  g.restore();
}
function clusterTex(kind) {
  return ctex(256, 256, (g, w, h) => {
    g.clearRect(0, 0, w, h);
    const n = kind === 'pine' ? 0 : 95;
    if (kind === 'pine') {
      for (let t = 0; t < 26; t++) {
        const cx = 128 + rr(-70, 70), cy = 128 + rr(-55, 55), v = rr(150, 245) | 0;
        g.strokeStyle = `rgb(${v},${v},${v})`; g.lineWidth = 1.6;
        for (let k = 0; k < 34; k++) {
          const a = rr(0, Math.PI * 2), l = rr(14, 30);
          g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(a) * l, cy + Math.sin(a) * l * .7); g.stroke();
        }
      }
      return;
    }
    for (let i = 0; i < n; i++) {
      const rad = 112 * Math.sqrt(R()), a = R() * Math.PI * 2;
      const x = 128 + Math.cos(a) * rad, y = 128 + Math.sin(a) * rad * .92;
      const v = (rr(150, 255)) | 0, s = rr(13, 21) * (1 - rad / 300);
      g.fillStyle = `rgb(${v},${Math.max(0, v - rr(0, 25)) | 0},${Math.max(0, v - rr(10, 40)) | 0})`;
      if (kind === 'ginkgo') {
        g.save(); g.translate(x, y); g.rotate(R() * 6.28); g.beginPath(); g.moveTo(0, 0);
        g.arc(0, 0, s, -Math.PI * .85, -Math.PI * .15); g.closePath(); g.fill(); g.restore();
      } else mapleShape(g, x, y, s, R() * 6.28);
    }
  });
}

function mountTex(roughness, peaks) {
  return ctex(2048, 256, (g, w, h) => {
    g.clearRect(0, 0, w, h);
    const pts = []; let y = h * .6;
    for (let x = 0; x <= w; x += 8) {
      const p = peaks.reduce((s, [c, wd, ht]) => s + ht * Math.exp(-Math.pow((x - c) / wd, 2)), 0);
      y = h * .82 - p + Math.sin(x * .013) * 10 + Math.sin(x * .041) * 5 * roughness + rr(-2, 2) * roughness;
      pts.push([x, Math.max(6, y)]);

    g.fillStyle = '#ffffff'; g.beginPath(); g.moveTo(0, h);

  _m.compose(_v.set(x, y, z), _q, _s);

  g.applyMatrix4(_m);
  g.groups = [];

/* ================= signposts (text) ================= */
function sign(text, x, z, face) {
  TEXTJOBS.push(() => {
    const W = text.length > 3 ? 3.4 : 2.6, H = 1.15, cw = Math.round(256 * W / H);
    const t = ctex(cw, 256, (g, w, h) => {
      g.fillStyle = '#6b4a2e'; g.fillRect(0, 0, w, h);
      for (let i = 0; i < 46; i++) { g.strokeStyle = `rgba(40,22,10,${R() * .28})`; g.lineWidth = 1 + R() * 2; g.beginPath(); const y = R() * h; g.moveTo(0, y); g.bezierCurveTo(w * .3, y + 6, w * .6, y - 6, w, y + 3); g.stroke(); }
      g.fillStyle = '#f3ead8'; g.font = `700 ${Math.min(130, (w * .82) / text.length) | 0}px "Noto Serif TC", serif`;
      g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, w / 2, h / 2 + 6);
    }, {repeat: false});
    const wood = new THREE.MeshStandardMaterial({color: '#5a3d26', roughness: .9}), front = new THREE.MeshStandardMaterial({map: t, roughness: .85});
    const ry = Math.atan2(face[0] - x, face[1] - z);
    const g = new THREE.BoxGeometry(W, H, .14);
    const m = uniqueMesh(g, [wood, wood, wood, wood, front, wood], 0, 0, 0, 0);
    m.position.set(x, 2.15 + H / 2, z); m.rotation.y = ry;
    for (const sx of [-1, 1]) {
      const p = uniqueMesh(new THREE.BoxGeometry(.14, 2.2, .14), wood, 0, 0, 0, 0);
      p.position.set(x + Math.cos(ry) * sx * (W / 2 - .3) - Math.sin(ry) * .12, 1.1, z - Math.sin(ry) * sx * (W / 2 - .3) - Math.cos(ry) * .12);
    }
  });
  circles.push([x, z, .6]);
}

/* ================= build foliage instanced meshes ================= */
function foliageMesh(list, map) {
  const mat = new THREE.MeshStandardMaterial({map, alphaTest: .5, side: THREE.DoubleSide, roughness: .8, envMapIntensity: .4});
  mat.onBeforeCompile = s => {
    s.uniforms.uTime = U.time;
    s.vertexShader = 'attribute vec3 aN; attribute float aPh; uniform float uTime;\n' + s.vertexShader
      .replace('#include <defaultnormal_vertex>', 'vec3 transformedNormal = normalMatrix * aN;')
      .replace('#include <begin_vertex>', 'vec3 transformed = vec3(position); transformed.x += sin(uTime*1.7+aPh)*0.05; transformed.y += cos(uTime*1.3+aPh)*0.03;');
    s.fragmentShader = s.fragmentShader.replace('#include <normal_fragment_begin>', THREE.ShaderChunk.normal_fragment_begin.replaceAll('normal *= faceDirection;', ''));
  };
  const im = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), mat, list.length);
  const aN = new Float32Array(list.length * 3), aPh = new Float32Array(list.length);
  const m = new THREE.Matrix4();
  list.forEach((f, i) => {
    m.compose(f.p, f.q, new THREE.Vector3(f.s, f.s, f.s)); im.setMatrixAt(i, m); im.setColorAt(i, f.c);
    aN[i * 3] = f.n.x; aN[i * 3 + 1] = f.n.y; aN[i * 3 + 2] = f.n.z; aPh[i] = f.ph;
  });
  im.geometry.setAttribute('aN', new THREE.InstancedBufferAttribute(aN, 3));
  im.geometry.setAttribute('aPh', new THREE.InstancedBufferAttribute(aPh, 1));
  im.castShadow = true; im.receiveShadow = true; im.frustumCulled = false;

    const apply = docs => {

async function shrink(file) {

  catch (e) { src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); }); }
  const w = src.width, h = src.height, s = Math.min(1, 1600 / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('encode')), 'image/jpeg', .82));
}
const upErr = c => ({too_large: '照片太大', unsupported_type: '這個照片格式不支援', quota_or_state: '雲端空間已滿', rate_limited: '上傳太頻繁，稍等一下再試', not_granted: '沒有上傳權限'}[c] || '上傳失敗');
async function saveNote() {
  const btn = document.getElementById('eSave'), msg = document.getElementById('eMsg');
  E.place = E.place.trim(); E.text = E.text.trim();
  if (!E.text && !E.keep.length && !E.add.length) { msg.textContent = '寫點文字或加一張照片再存。'; return; }
  btn.disabled = true; const uploaded = [];
  try {
    for (let i = 0; i < E.add.length; i++) {
      msg.textContent = `上傳照片 ${i + 1}／${E.add.length}…`;
      let blob; try { blob = await shrink(E.add[i].f); } catch (e) { blob = E.add[i].f; }
      const r = await J.assets.upload(blob, blob.type ? undefined : {type: 'image/jpeg'}); uploaded.push(r.id);
    }
    msg.textContent = '儲存中…';
    let pin = null;
    if (E.pinOn) pin = E.pin || (E.zone && ZB[E.zone] && !E.here ? zonePin(E.zone) : herePin());
    const data = {place: E.place || (E.zone && ZB[E.zone] ? ZB[E.zone].n : '未命名地點'), day: E.day, text: E.text,
      photos: E.keep.concat(uploaded), x: pin ? +pin.x.toFixed(2) : null, z: pin ? +pin.z.toFixed(2) : null,
      zone: E.zone || (pin ? (zoneAt(pin.x, pin.z) || {}).id || null : null), item: E.item, updatedAt: Date.now()};
    if (E.id) await J.col.doc(E.id).update(data); else await J.col.add(Object.assign({createdAt: Date.now()}, data));
    for (const p of E.removed) J.assets && J.assets.delete(p).catch(() => {});
    E.add.forEach(a => URL.revokeObjectURL(a.u)); J.usage = null;
    closeSheet(); toast('已儲存');
  } catch (e) {
    for (const p of uploaded) J.assets.delete(p).catch(() => {});
    btn.disabled = false; msg.textContent = (e && e.code ? upErr(e.code) : '儲存失敗') + '，請再試一次。網路不穩時可以先存文字，照片晚點再補。';
  }
}
async function delNote(id, b) {
  if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = '確定刪除？'; b.classList.add('pri'); setTimeout(() => { if (b.isConnected) { delete b.dataset.sure; b.textContent = '刪除'; b.classList.remove('pri'); } }, 4000); return; }
  const n = J.notes.find(x => x.id === id); if (!n) return;
  b.disabled = true;
  try { await J.col.doc(id).delete(); for (const p of n.photos || []) J.assets && J.assets.delete(p).catch(() => {}); J.usage = null; toast('已刪除'); }
  catch (e) { b.disabled = false; toast('刪除失敗，請再試一次'); }
}
function flyTo(n) {
  closeSheet(); markStarted(); stopTour();
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
  let px = n.x, pz = n.z;
  for (const d of [4, 3, 2, 1]) { const x = n.x - fx * d, z = n.z - fz * d; if (!blocked(x, z)) { px = x; pz = z; break; } }
  pos.x = px; pos.z = pz; pitch = .06;
}
async function exportMD() {
  let md = '# 金澤散步\n';
  for (let d = 0; d <= 4; d++) {
    const g = J.notes.filter(n => (n.day || 0) === d); if (!g.length) continue;
    md += `\n## ${DAYLBL[d].replace('　', ' ')}\n`;
    g.forEach(n => { md += `\n### ${n.place || '未命名地點'}（${fmtT(n.createdAt)}）\n\n${n.text || ''}\n` + ((n.photos || []).length ? `\n照片 ${n.photos.length} 張（存在手帳頁面裡）\n` : ''); });
  }
  if (!J.dl) { try { await navigator.clipboard.writeText(md); toast('已複製到剪貼簿'); } catch (e) { toast('這個畫面不能匯出'); } return; }
  try { await J.dl.save({filename: '金澤散步手帳.md', data: md}); } catch (e) { if (e && e.code !== 'declined') toast('匯出失敗'); }
}

  if (a === 'addz') openEditor({place: cur ? cur.n : '', zone: cur ? cur.id : null, pin: herePin(), here: true});
  else if (a === 'openz') openSheet('journal', {zone: b.dataset.z});
  else if (a === 'openi') openSheet('journal', {item: b.dataset.k});
  else if (a === 'all') { sheetArg = null; sheetMode = 'journal'; renderSheet(); }
  else if (a === 'day') { itinDay = +b.dataset.d; sheetMode = 'itin'; renderSheet(); }
  else if (a === 'zgo') { closeSheet(); markStarted(); stopTour(); goTo(ZB[b.dataset.z]); }
  else if (a === 'addi') { const d = +b.dataset.d, i = +b.dataset.i, it = ITIN[d - 1].items[i], z = zoneOf(it); openEditor({place: it.tt, day: d, item: it.id, zone: z, pin: z ? zonePin(z) : null}); }
  else if (['ieOn', 'ieDone', 'ieItem', 'ieNew', 'ieCancel', 'ieUp', 'ieDown', 'ieDel', 'ieReset', 'ieSave', 'deEdit', 'deSave'].includes(a)) itinAct(a, b);
  else if (a === 'fly') { const n = note(b.dataset.id); if (n) flyTo(n); }
  else if (a === 'edit') { const n = note(b.dataset.id); if (n) openEditor({note: n}); }
  else if (a === 'del') delNote(b.dataset.id, b);
  else if (a === 'photo') { viewer.querySelector('img').src = burl(b.dataset.p); viewer.hidden = false; }
  else if (a === 'export') exportMD();
  else if (a === 'pick') document.getElementById('eFile').click();
  else if (a === 'rmk') { E.keep = E.keep.filter(p => p !== b.dataset.p); E.removed.push(b.dataset.p); renderEdit(); }
  else if (a === 'rma') { const x = E.add.splice(+b.dataset.i, 1)[0]; if (x) URL.revokeObjectURL(x.u); renderEdit(); }
  else if (a === 'perm') permAct(b.dataset.k);
  else if (a === 'save') saveNote();
  else if (a === 'cancel') { const id = E && E.id; closeSheet(); if (id) openSheet('detail', id); }
});
